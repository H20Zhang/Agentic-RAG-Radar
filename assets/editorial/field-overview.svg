<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG as placement of information work</title>
  <desc id="desc">A research map from precompute, materialize, and retain toward defer, localize, and reacquire, with adaptivity, evidence, and state as three coupled placement decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#55758a"/>
    </marker>
    <style>
      .title{font:600 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172b36}
      .sub{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#58707d}
      .label{font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#193441}
      .small{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5d7480}
      .paper{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1b556e}
    </style>
  </defs>
  <rect width="1200" height="420" rx="22" fill="#fbfdfe"/>
  <text x="48" y="48" class="title">Agentic RAG is increasingly a placement-of-work problem</text>
  <text x="48" y="75" class="sub">What should be prepared before the query, what must remain adaptive after evidence arrives, and what state is worth keeping?</text>

  <rect x="48" y="112" width="310" height="238" rx="18" fill="#eef5f7" stroke="#c9dce3"/>
  <text x="76" y="148" class="label">Before the query</text>
  <text x="76" y="178" class="small">PRECOMPUTE</text>
  <text x="76" y="204" class="small">MATERIALIZE</text>
  <text x="76" y="230" class="small">RETAIN</text>
  <line x1="76" y1="250" x2="326" y2="250" stroke="#c6d9e0"/>
  <text x="76" y="282" class="paper">SIRA</text><text x="126" y="282" class="small">compile retrieval action</text>
  <text x="76" y="310" class="paper">A-RAG / LLM-Wiki</text><text x="193" y="310" class="small">expose structure</text>
  <text x="76" y="338" class="paper">Indexes / memory</text><text x="181" y="338" class="small">store future-use state</text>

  <rect x="842" y="112" width="310" height="238" rx="18" fill="#f2f7fa" stroke="#c9dce3"/>
  <text x="870" y="148" class="label">After evidence arrives</text>
  <text x="870" y="178" class="small">DEFER</text>
  <text x="870" y="204" class="small">LOCALIZE</text>
  <text x="870" y="230" class="small">REACQUIRE</text>
  <line x1="870" y1="250" x2="1120" y2="250" stroke="#c6d9e0"/>
  <text x="870" y="282" class="paper">ReFind</text><text x="928" y="282" class="small">result-conditioned search</text>
  <text x="870" y="310" class="paper">LENS</text><text x="915" y="310" class="small">query-time evidence regions</text>
  <text x="870" y="338" class="paper">Compression cost</text><text x="985" y="338" class="small">buy state back via tools</text>

  <line x1="360" y1="231" x2="838" y2="231" stroke="#55758a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="838" y1="257" x2="360" y2="257" stroke="#90a7b3" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="430" y="120" width="340" height="70" rx="16" fill="#ffffff" stroke="#cbdde4"/>
  <text x="458" y="150" class="label">Adaptivity placement</text>
  <text x="458" y="174" class="small">compile before retrieval ↔ react after observation</text>

  <rect x="430" y="205" width="340" height="70" rx="16" fill="#ffffff" stroke="#cbdde4"/>
  <text x="458" y="235" class="label">Evidence placement</text>
  <text x="458" y="259" class="small">materialize stable units ↔ localize query-time regions</text>

  <rect x="430" y="290" width="340" height="70" rx="16" fill="#ffffff" stroke="#cbdde4"/>
  <text x="458" y="320" class="label">State placement</text>
  <text x="458" y="344" class="small">retain useful state ↔ pay expected reacquisition cost</text>

  <text x="48" y="392" class="sub">Research bar: compare the whole lifecycle at matched answer/evidence quality—not one isolated metric such as rounds, context size, or indexing cost.</text>
</svg>