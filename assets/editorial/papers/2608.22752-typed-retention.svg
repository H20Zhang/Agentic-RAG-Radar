<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#4f7488"/></marker><style>.t{font:600 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17313e}.h{font:600 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1e4b60}.s{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#617883}.l{font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#2c6d87}.n{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9a5043}</style></defs><rect width="1800" height="1000" rx="28" fill="#fbfdfe"/><text x="70" y="75" class="t">Uniform compaction ignores that retained state has different loss costs</text><text x="70" y="112" class="s">Knowledge Triage materializes type once, then routes compaction, decomposition, retrieval, and verification by fidelity need.</text><rect x="75" y="210" width="350" height="170" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="115" y="265" class="h">Mixed working set</text><text x="115" y="310" class="s">constraints · procedures</text><text x="115" y="345" class="s">beliefs · preferences · episodes</text><rect x="545" y="195" width="320" height="200" rx="22" fill="#f3f7f9" stroke="#cbdde5"/><text x="585" y="250" class="h">Type classifier</text><text x="585" y="295" class="s">paid once at indexing</text><text x="585" y="335" class="l">semantic loss cost</text><text x="585" y="370" class="n">missed rule stays unprotected</text><path d="M425 295h110" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><path d="M865 295h120" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="995" y="140" width="345" height="135" rx="20" fill="#eaf5f2" stroke="#b8d7cd"/><text x="1035" y="190" class="h">Exact lane</text><text x="1035" y="230" class="s">pin / replicate constraints</text><rect x="995" y="315" width="345" height="135" rx="20" fill="#f4f7f8" stroke="#cedde3"/><text x="1035" y="365" class="h">Lossy lanes</text><text x="1035" y="405" class="s">compress by type-specific fidelity</text><rect x="1450" y="215" width="280" height="165" rx="22" fill="#fff" stroke="#cbdde5"/><text x="1490" y="270" class="h">Guard verifier</text><text x="1490" y="315" class="s">all flagged constraints?</text><text x="1490" y="350" class="n">else: Unsafe</text><path d="M1340 205h100" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><path d="M1340 380h100" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="125" y="545" width="470" height="205" rx="22" fill="#fff" stroke="#cbdde5"/><text x="170" y="600" class="h">Budget-matched compaction</text><text x="170" y="650" class="l">Constraint recall at 50/25/10%</text><text x="170" y="695" class="l">TypeCompact 1.00 / 0.95 / 0.80</text><text x="170" y="730" class="s">best type-blind 0.53 / 0.39 / 0.24</text><rect x="665" y="545" width="470" height="205" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="710" y="600" class="h">Decomposition locality</text><text x="710" y="650" class="l">0% violating configurations</text><text x="710" y="695" class="s">best topic baseline: 40%</text><text x="710" y="730" class="n">mean replication overhead: +14.5%</text><rect x="1205" y="545" width="470" height="205" rx="22" fill="#fff" stroke="#cbdde5"/><text x="1250" y="600" class="h">Scoped retrieval</text><text x="1250" y="650" class="l">Recall@50: 1.00 vs 0.91 dense</text><text x="1250" y="695" class="s">but typed scope is extra observability</text><text x="1250" y="730" class="n">50 author-written queries</text><rect x="210" y="835" width="1380" height="95" rx="20" fill="#fff6f2" stroke="#e5c7ba"/><text x="255" y="875" class="n">Do not over-read</text><text x="450" y="875" class="s">The guarantee is conditional on classifier recall; downstream retail tokens are unmatched, so artifact preservation is stronger evidence than task success.</text></svg>
