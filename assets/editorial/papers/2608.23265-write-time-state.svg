<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#4f7488"/></marker><style>.t{font:600 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17313e}.h{font:600 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1e4b60}.s{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#617883}.l{font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#2c6d87}.n{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9a5043}</style></defs><rect width="1800" height="1000" rx="28" fill="#fbfdfe"/><text x="70" y="75" class="t">Supersession can be resolved when writing state—not only when answering</text><text x="70" y="112" class="s">EvoWiki keeps one active entity-attribute value while retaining closed validity intervals, replacement edges, and source spans.</text><rect x="90" y="210" width="350" height="170" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="130" y="265" class="h">Meeting stream</text><text x="130" y="310" class="s">proposal → discussion → decision</text><text x="130" y="350" class="s">later meetings revise state</text><rect x="560" y="185" width="390" height="220" rx="22" fill="#f3f7f9" stroke="#cbdde5"/><text x="605" y="240" class="h">Incremental Build</text><text x="605" y="285" class="s">resolve · corefer · extract · route</text><text x="605" y="330" class="l">close old validity interval</text><text x="605" y="370" class="l">append one Active state</text><path d="M440 295h110" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="140" width="620" height="310" rx="24" fill="#fff" stroke="#cbdde5"/><text x="1125" y="195" class="h">Entity–attribute version chain</text><rect x="1130" y="235" width="150" height="95" rx="16" fill="#f7ece8" stroke="#ddbdb0"/><text x="1160" y="275" class="s">v1 · closed</text><text x="1160" y="310" class="n">Overturned</text><path d="M1280 282h65" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="1355" y="235" width="150" height="95" rx="16" fill="#f7ece8" stroke="#ddbdb0"/><text x="1385" y="275" class="s">v2 · closed</text><text x="1385" y="310" class="n">Overturned</text><path d="M1505 282h65" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="1580" y="235" width="90" height="95" rx="16" fill="#eaf5f2" stroke="#b8d7cd"/><text x="1598" y="275" class="s">v3</text><text x="1592" y="310" class="l">Active</text><text x="1130" y="390" class="s">every version retains meeting/span provenance and replacement edges</text><path d="M950 295h120" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="180" y="555" width="550" height="190" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="225" y="610" class="h">Matched overwrite control</text><text x="225" y="660" class="l">Macro accuracy 60.09 → 51.46</text><text x="225" y="700" class="s">same extraction, entity Wiki, and reader</text><rect x="820" y="555" width="400" height="190" rx="22" fill="#fff" stroke="#cbdde5"/><text x="865" y="610" class="h">Complete-Wiki Read</text><text x="865" y="660" class="l">17,143 tokens/query</text><text x="865" y="700" class="s">deterministic entity/time addressing</text><rect x="1310" y="555" width="310" height="190" rx="22" fill="#fff" stroke="#cbdde5"/><text x="1355" y="610" class="h">Build cost</text><text x="1355" y="660" class="l">114,016 tokens</text><text x="1355" y="700" class="s">per project; latency missing</text><rect x="205" y="835" width="1390" height="95" rx="20" fill="#fff6f2" stroke="#e5c7ba"/><text x="250" y="875" class="n">Do not over-read</text><text x="445" y="875" class="s">Trace IDs are architectural; provenance correctness is not scored. Cross-system gains also change evidence exposure and lifecycle cost.</text></svg>
