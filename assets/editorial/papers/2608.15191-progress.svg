<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#4f7488"/></marker><style>.t{font:600 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17313e}.h{font:600 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1e4b60}.s{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#617883}.l{font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#2c6d87}.n{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8a4f44}</style></defs><rect width="1800" height="1000" rx="28" fill="#fbfdfe"/><text x="70" y="75" class="t">RAAC — make search progress observable before deciding to continue</text><text x="70" y="112" class="s">The overlay does not replace the retriever; it measures trajectory state and chooses continue, redirect, or stop.</text><rect x="80" y="215" width="330" height="190" rx="22" fill="#f3f7f9" stroke="#cbdde5"/><text x="120" y="270" class="h">Existing DRA</text><text x="120" y="315" class="s">search → reason → search</text><text x="120" y="350" class="s">history accumulates</text><text x="120" y="385" class="n">but progress can be implicit</text><path d="M410 310 H555" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="565" y="185" width="450" height="250" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="605" y="240" class="h">Retrieval-aware signals</text><text x="605" y="287" class="l">coverage</text><text x="755" y="287" class="s">what criteria are satisfied?</text><text x="605" y="327" class="l">novelty</text><text x="755" y="327" class="s">are documents new?</text><text x="605" y="367" class="l">diversity</text><text x="755" y="367" class="s">did the query change?</text><text x="605" y="407" class="l">alignment</text><text x="755" y="407" class="s">is search drifting?</text><path d="M1015 310 H1160" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="1170" y="185" width="550" height="250" rx="22" fill="#fff" stroke="#cbdde5"/><text x="1210" y="240" class="h">Controller</text><rect x="1220" y="285" width="135" height="72" rx="14" fill="#eef6f8" stroke="#bfd6df"/><text x="1247" y="330" class="l">continue</text><rect x="1378" y="285" width="150" height="72" rx="14" fill="#eef6f8" stroke="#bfd6df"/><text x="1405" y="330" class="l">redirect</text><rect x="1550" y="285" width="125" height="72" rx="14" fill="#eef6f8" stroke="#bfd6df"/><text x="1582" y="330" class="l">stop</text><text x="1210" y="405" class="s">redirect invokes a critical re-thinker for a substantially different query</text><path d="M1445 440 C1445 540 260 570 245 415" fill="none" stroke="#7394a4" stroke-width="3" marker-end="url(#a)"/><text x="700" y="555" class="s">result-conditioned control closes the loop</text><rect x="210" y="640" width="600" height="180" rx="22" fill="#fff" stroke="#cbdde5"/><text x="250" y="695" class="h">Matched signal</text><text x="250" y="740" class="l">BrowseComp-Plus: ~14 fewer searches</text><text x="250" y="780" class="s">~+3 accuracy points on average across seven DRAs</text><rect x="990" y="640" width="600" height="180" rx="22" fill="#f3f7f9" stroke="#cbdde5"/><text x="1030" y="695" class="h">Accounting boundary</text><text x="1030" y="740" class="n">fewer searches ≠ lower total compute</text><text x="1030" y="780" class="s">coverage updates + controller + re-thinker add LLM work</text><text x="210" y="895" class="s">Strongest interpretation: progress observability is a useful control surface; total-cost superiority and the isolated value of the four signals remain open.</text></svg>