<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0v8l10-4z" fill="#4f7488"/></marker><style>.t{font:600 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17313e}.h{font:600 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1e4b60}.s{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#617883}.l{font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#2c6d87}.n{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9a5043}</style></defs><rect width="1800" height="1000" rx="28" fill="#fbfdfe"/><text x="70" y="75" class="t">Open-world skill creation needs a query policy and a persistence gate</text><text x="70" y="112" class="s">SkillAlchemy separates missing-requirement discovery from deciding which source-derived procedures deserve reusable scope.</text><rect x="80" y="210" width="300" height="170" rx="22" fill="#f3f7f9" stroke="#cbdde5"/><text x="120" y="265" class="h">Underspecified brief</text><text x="120" y="310" class="s">instance values</text><text x="120" y="350" class="n">missing boundaries</text><rect x="480" y="180" width="390" height="230" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="525" y="235" class="h">Contrastive probes</text><text x="525" y="280" class="l">substitution</text><text x="525" y="320" class="l">boundary</text><text x="525" y="360" class="l">neighbor capability</text><path d="M380 295h90" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="970" y="180" width="350" height="230" rx="22" fill="#fff" stroke="#cbdde5"/><text x="1015" y="235" class="h">Focused acquisition</text><text x="1015" y="280" class="s">docs · repositories</text><text x="1015" y="320" class="s">issues · examples</text><text x="1015" y="360" class="l">structured findings</text><path d="M870 295h90" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="1420" y="180" width="300" height="230" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="1460" y="235" class="h">Admission gate</text><text x="1460" y="280" class="l">General</text><text x="1460" y="320" class="l">Scoped</text><text x="1460" y="360" class="n">Exclude / unresolved</text><path d="M1320 295h90" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="185" y="545" width="420" height="205" rx="22" fill="#fff" stroke="#cbdde5"/><text x="230" y="600" class="h">Package result</text><text x="230" y="650" class="l">55.8% across 87 tasks</text><text x="230" y="695" class="s">MUSE 47.2 · OpenSkill 46.0</text><text x="230" y="730" class="s">human skills 54.4 (descriptive)</text><rect x="690" y="545" width="420" height="205" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="735" y="600" class="h">Component evidence</text><text x="735" y="650" class="l">remove a core stage</text><text x="735" y="695" class="n">−5.0 to −15.7 points</text><text x="735" y="730" class="s">3 domains · 1 runtime config</text><rect x="1195" y="545" width="420" height="205" rx="22" fill="#fff" stroke="#cbdde5"/><text x="1240" y="600" class="h">Missing accounting</text><text x="1240" y="650" class="n">LLM/search call counts</text><text x="1240" y="695" class="n">pages · source tokens · dollars</text><text x="1240" y="730" class="s">69.1K tokens reported per LLM call</text><rect x="205" y="835" width="1390" height="95" rx="20" fill="#fff6f2" stroke="#e5c7ba"/><text x="250" y="875" class="n">Do not over-read</text><text x="445" y="875" class="s">The full gain bundles queries, retrieved evidence, schema, admission, grammar, orchestration, and artifact content.</text></svg>
