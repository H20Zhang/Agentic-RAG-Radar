<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#4f7488"/></marker><style>.t{font:600 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17313e}.h{font:600 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1e4b60}.s{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#617883}.l{font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#2c6d87}.n{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8a4f44}</style></defs><rect width="1800" height="1000" rx="28" fill="#fbfdfe"/><text x="70" y="75" class="t">Context compression can move cost from prompt state into external reacquisition</text><text x="70" y="112" class="s">Completion can look unchanged while the interaction path becomes much more expensive.</text><rect x="95" y="210" width="420" height="160" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="135" y="265" class="h">Retained execution state</text><text x="135" y="310" class="s">agent already knows what it needs</text><text x="135" y="345" class="l">→ continue task work</text><rect x="690" y="190" width="420" height="200" rx="22" fill="#f3f7f9" stroke="#cbdde5"/><text x="730" y="245" class="h">Compression drops state</text><text x="730" y="290" class="s">queryable environment state disappears</text><text x="730" y="330" class="n">context tokens ↓</text><text x="730" y="365" class="s">but information need is unchanged</text><rect x="1285" y="210" width="420" height="160" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="1325" y="265" class="h">Re-query environment</text><text x="1325" y="310" class="s">tools buy the missing state back</text><text x="1325" y="345" class="n">retrieval calls ↑</text><path d="M515 290 H680" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><path d="M1110 290 H1275" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><path d="M1490 380 C1490 520 920 560 900 400" fill="none" stroke="#7394a4" stroke-width="3" marker-end="url(#a)"/><text x="1130" y="535" class="s">repeated compression can create a re-query loop</text><rect x="260" y="610" width="560" height="190" rx="22" fill="#fff" stroke="#cbdde5"/><text x="305" y="665" class="h">Observed at 5× compression</text><text x="305" y="710" class="l">GPT-5.5 High: 21.0 → 63.9 retrieval calls</text><text x="305" y="750" class="s">completion: 80% → 85% (not significant)</text><text x="305" y="785" class="s">five of six retrieval increases remain significant</text><rect x="980" y="610" width="560" height="190" rx="22" fill="#eef6f8" stroke="#bfd6df"/><text x="1025" y="665" class="h">Oracle restoration</text><text x="1025" y="710" class="l">restore dropped queryable state</text><text x="1025" y="750" class="s">DeepSeek High tool calls: 72.9 → 35.8</text><text x="1025" y="785" class="s">supports a causal reacquisition explanation</text><rect x="260" y="850" width="1280" height="90" rx="20" fill="#fff" stroke="#cbdde5"/><text x="305" y="890" class="n">Do not over-read</text><text x="500" y="890" class="s">ALFWorld shows no retrieval surge under the same sliding compression: recoverability and environment semantics determine the tax.</text></svg>