<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#4f7488"/></marker><style>.t{font:600 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#17313e}.h{font:600 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1e4b60}.s{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#617883}.l{font:600 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#2c6d87}.n{font:600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8a4f44}</style></defs><rect width="1800" height="1000" rx="28" fill="#fbfdfe"/><text x="70" y="75" class="t">LENS — move evidence materialization from indexing time to query time</text><text x="70" y="112" class="s">The research delta is not “index-free wins”; it is a different placement of evidence boundaries and freshness cost.</text><rect x="70" y="180" width="690" height="610" rx="24" fill="#f3f7f9" stroke="#cbdde5" stroke-width="2"/><text x="110" y="235" class="h">Pre-materialized indexed RAG</text><rect x="120" y="300" width="180" height="90" rx="16" fill="#fff" stroke="#bcd1da"/><text x="155" y="352" class="l">raw docs</text><path d="M300 345 H410" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="420" y="290" width="220" height="110" rx="16" fill="#e9f2f5" stroke="#aac7d2"/><text x="472" y="335" class="l">chunk + index</text><text x="474" y="368" class="s">fixed before query</text><path d="M530 405 V500" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="360" y="515" width="340" height="120" rx="16" fill="#fff" stroke="#bcd1da"/><text x="405" y="562" class="l">retrieve fixed units</text><text x="402" y="597" class="s">fast when structure stays valid</text><text x="120" y="690" class="n">Boundary</text><text x="235" y="690" class="s">stale index or wrong pre-query granularity</text><text x="120" y="730" class="s">The query can only choose among units that already exist.</text><rect x="860" y="180" width="870" height="610" rx="24" fill="#eef6f8" stroke="#bdd5de" stroke-width="2"/><text x="900" y="235" class="h">LENS: latent evidence until the query arrives</text><rect x="930" y="300" width="205" height="90" rx="16" fill="#fff" stroke="#bcd1da"/><text x="978" y="353" class="l">raw docs</text><path d="M1135 345 H1230" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="1240" y="285" width="380" height="120" rx="16" fill="#fff" stroke="#aac7d2"/><text x="1280" y="330" class="l">query-conditioned proposals</text><text x="1280" y="366" class="s">lexical · local · exploratory regions</text><path d="M1430 410 V500" stroke="#4f7488" stroke-width="3" marker-end="url(#a)"/><rect x="1210" y="515" width="440" height="125" rx="16" fill="#e2f0f4" stroke="#9fc2cf"/><text x="1275" y="560" class="l">inspect → update belief → stop?</text><text x="1255" y="597" class="s">regions become evidence only when useful</text><path d="M1210 575 C1110 575 1095 440 1240 365" fill="none" stroke="#7394a4" stroke-width="2.5" marker-end="url(#a)"/><text x="930" y="690" class="l">What changes</text><text x="1090" y="690" class="s">freshness + query-dependent evidence boundaries</text><text x="930" y="730" class="n">Cost</text><text x="1000" y="730" class="s">more online tokens / latency than ReAct in reported accounting</text><rect x="185" y="845" width="1430" height="95" rx="20" fill="#fff" stroke="#cbdde5"/><text x="230" y="885" class="h">Evidence boundary</text><text x="490" y="885" class="s">Evidence recall 84.8 vs 50.4, but D500 answer EM 62.4 vs 65.2 for ReAct.</text><text x="490" y="920" class="s">Interpretation: stronger localization/grounding and freshness; lifecycle cost superiority remains unproven.</text></svg>