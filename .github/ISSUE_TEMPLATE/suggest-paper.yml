name: Suggest an Agentic RAG paper
description: Suggest a paper that materially changes how an agent acquires external information.
title: "[Paper] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the radar. We prioritize work where **external retrieval/search/context acquisition is substantive** and an **agent, controller, or learned policy materially controls whether, what, where, how, or how many times information is acquired**.

        Fixed top-k RAG and generic agents where retrieval is incidental are usually out of scope. Strong negative results, historical baselines, and causal confounders are welcome.

  - type: input
    id: paper_title
    attributes:
      label: Paper title
      placeholder: Full paper title
    validations:
      required: true

  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      description: Prefer the canonical paper or preprint page.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true

  - type: input
    id: published
    attributes:
      label: Publication or preprint date
      description: If known.
      placeholder: YYYY-MM-DD

  - type: input
    id: code_url
    attributes:
      label: Code or project URL
      description: Optional.
      placeholder: https://github.com/...

  - type: textarea
    id: retrieval_role
    attributes:
      label: Why is retrieval substantive here?
      description: Explain why external search/retrieval/context acquisition is central rather than incidental.
      placeholder: What information must be acquired externally, and why does it matter to the task?
    validations:
      required: true

  - type: textarea
    id: control
    attributes:
      label: What does the agent or controller actually control?
      description: Be specific about whether, what, where, how, or how many times to retrieve.
      placeholder: The controller observes ... and chooses ...
    validations:
      required: true

  - type: textarea
    id: baseline
    attributes:
      label: Closest baseline or prior design point
      description: Compared with what should we judge the claimed delta?
      placeholder: Fixed top-k, an adaptive baseline, prior IR/QA method, same harness with a weaker interface, etc.
    validations:
      required: true

  - type: textarea
    id: delta
    attributes:
      label: What is the key research delta?
      description: State the smallest claim that would still make this paper worth adding to the field map.
      placeholder: The important change is ...
    validations:
      required: true

  - type: textarea
    id: caveats
    attributes:
      label: Negative results or causal confounders
      description: Optional, but especially useful. Note unmatched calls/tokens/latency, stronger primitives, model changes, missing ablations, or results that weaken the headline.
      placeholder: The strongest alternative explanation is ...

  - type: checkboxes
    id: scope_check
    attributes:
      label: Scope check
      options:
        - label: I believe this work has substantive external information acquisition and meaningful adaptive retrieval control.
          required: true
