          def support_date(block: str, records: dict[str, dict]) -> list:
              m = re.search(r'supports="([^"]+)"', block)
              if not m:
                  raise RuntimeError('direction block missing supports metadata')
              raw = m.group(1)
              if raw == 'none':
                  return []
              dates = []
              for identity in raw.split(','):
                  rec = records.get(identity)
                  if rec is None or rec.get('time_provenance') != 'native_v2':
                      raise RuntimeError(f'non-native or missing period support: {identity}')
                  dates.append(datetime.fromisoformat(rec['radar_published_at'].replace('Z', '+00:00')).date())
              return dates

          def rewrite_period(text: str, start_anchor: str, next_anchor: str, heading: str, window_start, window_end, new_block: str) -> str:
              start = text.index(start_anchor) + len(start_anchor)
              end = text.index(next_anchor, start)
              section = text[start:end]
              hm = re.search(r'(?m)^### .+$', section)
              if hm is None:
                  raise RuntimeError(f'period heading missing after {start_anchor}')
              body = section[hm.end():]
              blocks = list(re.finditer(r'(?ms)^- \*\*.*?(?=^- \*\*|\Z)', body.strip()))
              if not blocks:
                  raise RuntimeError(f'no direction blocks after {start_anchor}')
              records = {
                  json.loads(p.read_text(encoding='utf-8')).get('arxiv_id'): json.loads(p.read_text(encoding='utf-8'))
                  for p in (ROOT / 'data' / 'papers').glob('*.json')
              }
              kept = []
              for bm in blocks:
                  block = bm.group(0).strip()
                  dates = support_date(block, records)
                  if not dates:
                      kept.append(block)
                      continue
                  inside = [window_start <= d <= window_end for d in dates]
                  if all(inside):
                      kept.append(block)
                  elif any(inside):
                      raise RuntimeError('partial-support rollover requires editorial re-synthesis')
              rebuilt = section[:hm.start()] + heading + '\n\n' + new_block.strip()
              if kept:
                  rebuilt += '\n\n' + '\n\n'.join(kept)
              rebuilt += '\n\n'
              return text[:start] + rebuilt + text[end:]

