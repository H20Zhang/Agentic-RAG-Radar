                  text = rewrite_period(text, '<a id="last-30-days"></a>', '<a id="field-map"></a>', '### 过去 30 天 · 2026-08-05—2026-09-03', datetime(2026,8,5).date(), datetime(2026,9,3).date(), direction_zh)
                  old = '| **怎样对检索结论做因果归因？** | [Training Protocols](papers/2605.27881.md) → [Pi-Serini](papers/2605.10848.md) → [VAKRA](papers/2608.12282.md) → [AgenticRAG-FP](papers/2608.20627.zh.md) | 从 evidence coverage、interface/harness 匹配，到跨源执行和 live fault intervention，逐层定位因果路径。 |'
                  new = '| **怎样对检索结论做因果归因？** | [Training Protocols](papers/2605.27881.md) → [Pi-Serini](papers/2605.10848.md) → [Skill Following](papers/2609.00549.zh.md) → [VAKRA](papers/2608.12282.md) → [AgenticRAG-FP](papers/2608.20627.zh.md) | 从证据覆盖、接口/评测框架匹配，到同任务实际效用归因、跨来源执行和 live fault intervention，逐层定位因果路径。 |'
              text = replace_once(text, old, new, path + ' causal reading path')
              p.write_text(text, encoding='utf-8')

          cat = ROOT / 'categories' / 'evaluation-analysis.md'
          text = cat.read_text(encoding='utf-8')
          anchor = '## Current design anchors\n\n'
          addition = '''### [Skill Following](../papers/2609.00549.md) — ★★★★☆

**Design point:** pair skill-enabled and skill-disabled outcomes on the same tasks where the enabled run actually invoked retrieval, separating selective call coverage from realized same-task utility.

**Boundary:** the evaluated subset is selected by the skill-enabled policy after treatment, tool availability differs across the pair, and complete token/tool/latency cost is unreported.

'''
          text = replace_once(text, anchor, anchor + addition, 'evaluation category')
          cat.write_text(text, encoding='utf-8')

          lib_en = ROOT / 'library' / 'README.en.md'
          text = lib_en.read_text(encoding='utf-8')
          old = '[Pi-Serini](../papers/2605.10848.md) → [Is Grep All You Need?](../papers/2605.15184.md) → [Training Protocols](../papers/2605.27881.md) → [VAKRA](../papers/2608.12282.md)'
          new = '[Pi-Serini](../papers/2605.10848.md) → [Is Grep All You Need?](../papers/2605.15184.md) → [Training Protocols](../papers/2605.27881.md) → [Skill Following](../papers/2609.00549.md) → [VAKRA](../papers/2608.12282.md)'
          text = replace_once(text, old, new, 'English library chain')
          old = 'Backend score, surfaced evidence, agent harness, model, and tool budget are tightly coupled. Leaderboard gains are usually system-level evidence before they are component evidence.'
          new = 'Backend score, surfaced evidence, agent harness, model, and tool budget are tightly coupled. Skill Following adds another split: selective retrieval coverage is not realized same-task utility. Leaderboard gains remain system-level evidence until these paths are matched.'
          text = replace_once(text, old, new, 'English library prose')
          lib_en.write_text(text, encoding='utf-8')

          lib_zh = ROOT / 'library' / 'README.md'
          text = lib_zh.read_text(encoding='utf-8')
          old = '[Pi-Serini](../papers/2605.10848.md) → [Is Grep All You Need?](../papers/2605.15184.md) → [Training Protocols](../papers/2605.27881.md) → [VAKRA](../papers/2608.12282.zh.md)'
          new = '[Pi-Serini](../papers/2605.10848.md) → [Is Grep All You Need?](../papers/2605.15184.md) → [Training Protocols](../papers/2605.27881.md) → [Skill Following](../papers/2609.00549.zh.md) → [VAKRA](../papers/2608.12282.zh.md)'
          text = replace_once(text, old, new, 'Chinese library chain')
          old = '后端分数、呈现给 Agent 的证据、Agent 框架、模型与工具预算会紧密耦合；排行榜增益通常只能先作为系统层面证据。'
          new = '后端分数、呈现给 Agent 的证据、Agent 框架、模型与工具预算会紧密耦合；Skill Following 又拆出一层：选择在哪些任务上检索，不等于检索后对同一任务产生了实际效用。只有这些路径被配平，排行榜增益才可能从系统层证据收缩为组件证据。'
          text = replace_once(text, old, new, 'Chinese library prose')
          lib_zh.write_text(text, encoding='utf-8')

          vr = ROOT / 'scripts' / 'validate_reading.py'
          text = vr.read_text(encoding='utf-8')
          text = replace_once(text, f'SYNTHESIS_TIMESTAMP = "{OLD_TS}"', f'SYNTHESIS_TIMESTAMP = "{NEW_TS}"', 'validator timestamp')
          text = replace_once(text, '"last-7-days": (date(2026, 8, 26), date(2026, 9, 1)),', '"last-7-days": (date(2026, 8, 28), date(2026, 9, 3)),', 'validator 7-day window')
          text = replace_once(text, '"last-30-days": (date(2026, 8, 3), date(2026, 9, 1)),', '"last-30-days": (date(2026, 8, 5), date(2026, 9, 3)),', 'validator 30-day window')
          vr.write_text(text, encoding='utf-8')

          tp = ROOT / 'tests' / 'test_validate_reading.py'
          text = tp.read_text(encoding='utf-8').replace(OLD_TS, NEW_TS)
          en = (ROOT / 'README.en.md').read_text(encoding='utf-8')
          periods = en[en.index('<a id="periods"></a>'):en.index('<a id="field-map"></a>')]
          actual_new_signal = periods.count('state="new_signal"')
          if actual_new_signal != 27:
              raise RuntimeError(f'unexpected synthesized new_signal count: {actual_new_signal}')
          text = replace_once(text, 'self.assertEqual(33, periods.count(\'state="new_signal"\'))', f'self.assertEqual({actual_new_signal}, periods.count(\'state="new_signal"\'))', 'test period count')
          tp.write_text(text, encoding='utf-8')

          # Sanity checks before generated projections.
          for path in ('README.md', 'README.en.md'):
              text = (ROOT / path).read_text(encoding='utf-8')
              assert text.count('<a id="entry-2609.00549"></a>') == 1
              assert text.count('supports="2609.00549"') == 2
              assert OLD_TS not in text
          PY
          python scripts/build_paper_index.py
          rm .github/workflows/radar-once-20260903.yml

      - name: Run all repository validators
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_paper_index.py --check
          python scripts/validate.py
          python scripts/validate_reading.py
          python scripts/validate_public.py
          git diff --check

      - name: Commit validated candidate tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'Update Agentic RAG radar through 2026-09-03'
          git push origin HEAD:agent/time-first-radar-v2
