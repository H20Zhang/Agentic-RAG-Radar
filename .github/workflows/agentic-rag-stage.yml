name: Agentic RAG staging transform

on:
  push:
    branches: [research-radar-reading-v1]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.head_commit.message == 'Finalize validated Agentic RAG staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-radar-reading-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: pip install 'jsonschema[format]>=4.23,<5' 'pillow>=11,<12'

      - name: Apply accepted CoBRA transaction
        run: |
          python scripts/_stage_agentic_rag_20260904.py
          python scripts/_stage_agentic_rag_20260904_fix.py
          python scripts/_stage_agentic_rag_20260904_fix2.py
          python scripts/_stage_agentic_rag_20260904_fix3.py

      - name: Build generated paper index
        run: python scripts/build_paper_index.py

      - name: Validate transaction
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_paper_index.py --check
          python scripts/validate.py
          python scripts/validate_reading.py
          python scripts/validate_public.py
          git diff --check

      - name: Commit validated staging tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agentic-rag-stage.yml scripts/_stage_agentic_rag_20260904.py scripts/_stage_agentic_rag_20260904_fix.py scripts/_stage_agentic_rag_20260904_fix2.py scripts/_stage_agentic_rag_20260904_fix3.py
          git add -A
          git commit -m 'Stage Agentic RAG update 2026-09-04'
          git push origin HEAD:research-radar-reading-v1
