name: Validate Radar Data

on:
  push:
    branches: [main, research-radar-reading-v1, agent/time-first-radar-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: pip install 'jsonschema[format]>=4.23,<5' 'pillow>=11,<12'

      - name: Apply staged research transaction
        run: |
          python scripts/_automation_fix.py
          python scripts/_automation_sep1.py
          python scripts/_automation_postfix.py

      - name: Rebuild generated paper index
        run: python scripts/build_paper_index.py

      - name: Run contract unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log

      - name: Upload private diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: /tmp/tests.log
          retention-days: 1

      - name: Check generated paper index
        run: python scripts/build_paper_index.py --check

      - name: Validate canonical paper records
        run: python scripts/validate.py

      - name: Validate bilingual progressive reading surfaces
        run: |
          set -o pipefail
          python scripts/validate_reading.py 2>&1 | tee /tmp/reading.log

      - name: Upload reading diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reading-diagnostics
          path: /tmp/reading.log
          retention-days: 1

      - name: Validate public research surfaces
        run: python scripts/validate_public.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit validated staging tree
        run: |
          rm scripts/_automation_sep1.py scripts/_automation_fix.py scripts/_automation_postfix.py
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Agentic RAG radar through 2026-09-01"
          git push origin HEAD:agent/time-first-radar-v2
