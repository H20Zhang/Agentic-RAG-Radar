name: Validate Radar Data

on:
  push:
    branches: [main, research-radar-reading-v1, agent/time-first-radar-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: pip install 'jsonschema[format]>=4.23,<5' 'pillow>=11,<12'

      - name: Run contract unit tests
        run: python -m unittest discover -s tests -v

      - name: Check generated paper index
        run: python scripts/build_paper_index.py --check

      - name: Validate canonical paper records
        run: python scripts/validate.py

      - name: Validate bilingual progressive reading surfaces
        run: python scripts/validate_reading.py

      - name: Validate public research surfaces
        run: python scripts/validate_public.py
