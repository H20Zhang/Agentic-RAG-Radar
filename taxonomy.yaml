version: 1

primary_categories:
  planning_query_formulation:
    label: Planning & Query Formulation
    description: Agent-controlled decomposition, retrieval planning, query generation, reformulation, and stopping plans.

  retrieval_tool_use:
    label: Retrieval & Tool Use
    description: Agent-controlled selection or execution of retrievers, search engines, databases, corpora, tools, and retrieval operators.

  iterative_reasoning_verification:
    label: Iterative Reasoning & Verification
    description: Interleaving retrieval with reasoning, critique, evidence inspection, verification, and adaptive stopping.

  multi_agent_orchestration:
    label: Multi-Agent & Orchestration
    description: Coordination among specialized retrieval, search, reasoning, verification, or synthesis agents.

  learning_optimization:
    label: Learning & Optimization
    description: Learning retrieval policies, routing, search strategies, workflow controllers, or agentic RAG behavior with SFT, preference learning, RL, or related optimization.

  evaluation_analysis:
    label: Evaluation & Analysis
    description: Benchmarks, surveys, diagnostic studies, failure analyses, datasets, and evaluation methods specifically informative for agentic retrieval systems.

