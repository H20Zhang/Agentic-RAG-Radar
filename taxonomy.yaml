inclusion_policy:
  include_if: >-
    Retrieval, search, or external context acquisition is a substantive research component and an agent,
    controller, policy, or iterative reasoning loop materially controls whether, what, where, how, or how
    many times information is retrieved.
  exclude_if:
    - Fixed retrieve-top-k-then-generate RAG with no adaptive retrieval control.
    - Generic agents where retrieval is incidental rather than a research contribution.
    - Pure retriever, embedding, reranker, or indexing work without agentic control.
    - Pure long-context work without external retrieval or search control.
    - Product/tutorial repositories without a research contribution, unless tracked separately as resources.

scoring:
  relevance:
    scale: [0, 1]
    meaning: Probability that the work satisfies the inclusion policy.
  importance:
    scale: [1, 5]
    meaning: Estimated research significance relative to existing agentic RAG work, not topical fit.
  confidence:
    values: [high, medium, low]
    meaning: Confidence in the curator's classification and interpretation.
